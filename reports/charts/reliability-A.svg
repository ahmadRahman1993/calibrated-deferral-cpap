  <text x="16" y="310" text-anchor="middle" font-size="13" fill="#374151" transform="rotate(-90, 16, 310)">Accuracy</text>

  <!-- Perfect calibration diagonal -->
  <line x1="70" y1="570" x2="610" y2="50" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Connected line between bin points -->
  <polyline points="394,440 502,370 610,223.78590078328983" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bin circles -->
  <circle cx="394" cy="440" r="4.0835509138381205" fill="#3b82f6" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="1.5">
