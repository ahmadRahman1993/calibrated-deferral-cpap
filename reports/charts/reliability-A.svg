  <!-- Axes -->
  <line x1="70" y1="50" x2="70" y2="570" stroke="#374151" stroke-width="1.5"/>
  <line x1="70" y1="570" x2="610" y2="570" stroke="#374151" stroke-width="1.5"/>

  <!-- Axis labels -->
