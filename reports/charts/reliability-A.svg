  <circle cx="610" cy="223.78590078328983" r="12" fill="#3b82f6" fill-opacity="0.7" stroke="#1d4ed8" stroke-width="1.5">
      <title>Bin 9: mean confidence=1.000, accuracy=0.666, n=383</title>
    </circle>

  <!-- Stats annotation -->
  <text x="605" y="70" text-anchor="end" font-size="11" fill="#6b7280">ECE: 0.3370</text>
  <text x="605" y="86" text-anchor="end" font-size="11" fill="#6b7280">Brier: 0.3364</text>
  <text x="605" y="102" text-anchor="end" font-size="11" fill="#6b7280">n: 400</text>
